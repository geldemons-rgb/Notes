<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Центр управления сетью</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--text:#1b2127;--muted:#8a93a0;--line:#dde2e8;--accent:#1f6feb;--ok:#1a8a4a;--warn:#b7791f;--bad:#d1383d;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161b;--card:#1b2027;--text:#e6e9ed;--muted:#6f7885;--line:#2f353e;--accent:#6aa5ff;--ok:#4cc380;--warn:#e0a84a;--bad:#ff6b6f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12161b;--card:#1b2027;--text:#e6e9ed;--muted:#6f7885;--line:#2f353e;--accent:#6aa5ff;--ok:#4cc380;--warn:#e0a84a;--bad:#ff6b6f;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45}
main{max-width:1000px;margin:0 auto;padding:20px 16px 32px}
h1{font-size:1.5rem;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 16px}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.kpi div,.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.kpi small{display:block;color:var(--muted)}
.kpi strong{font-size:1.5rem}
.grid{display:grid;grid-template-columns:1.6fr 1fr;gap:14px}
@media (max-width:760px){.grid{grid-template-columns:1fr}}
button{background:none;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:7px 10px;cursor:pointer;font:inherit;font-size:.85rem}
button:hover{border-color:var(--accent)}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
svg{width:100%;height:auto;display:block}
.n{cursor:pointer}
h3{margin:0 0 8px;font-size:1rem}
.log{font-size:.85rem;max-height:170px;overflow:auto}
.log p{margin:0 0 6px;padding-left:8px;border-left:3px solid var(--line)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}
body{background:radial-gradient(1200px 500px at 50% -120px,color-mix(in srgb,var(--accent) 20%,transparent),transparent),var(--bg)}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:.85rem;background:var(--card);font-variant-numeric:tabular-nums}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok);animation:blink 1.6s infinite}
h1{background:linear-gradient(90deg,var(--text),var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:-.5px}
.kpi div,.card{box-shadow:0 6px 22px rgba(0,0,0,.10)}
.kpi div{border-top:3px solid var(--ok)}
.kpi div:nth-child(2){border-top-color:var(--bad)}
.kpi div:nth-child(3){border-top-color:var(--warn)}
.kpi strong{font-variant-numeric:tabular-nums;letter-spacing:-.5px}
button{transition:.15s}
button:hover{transform:translateY(-1px);box-shadow:0 3px 10px rgba(0,0,0,.18)}
#rnd{background:var(--bad);color:#fff;border-color:var(--bad)}
.n{transition:filter .2s}
.n:hover{filter:brightness(1.2)}
.pulse{animation:pulse 1.2s infinite}
.flow{stroke-dasharray:6 6;animation:flow 1s linear infinite}
@keyframes blink{50%{opacity:.35}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes flow{to{stroke-dashoffset:-12}}
@media (prefers-reduced-motion:reduce){.dot,.pulse,.flow{animation:none}}
:root[data-theme="navy"]{--bg:#0a1628;--card:#10213b;--text:#e3ecff;--muted:#7f93b5;--line:#1f3558;--accent:#4da3ff;--ok:#3ddc97;--warn:#ffc857;--bad:#ff5d6c;color-scheme:dark}
:root[data-theme="neon"]{--bg:#0d0221;--card:#1a0b3d;--text:#f5e9ff;--muted:#a28bc9;--line:#3a1f70;--accent:#ff2bd6;--ok:#00f5a0;--warn:#ffe14d;--bad:#ff3860;color-scheme:dark}
:root[data-theme="green"]{--bg:#04110a;--card:#08200f;--text:#c9ffd8;--muted:#5fa578;--line:#15462a;--accent:#2dff7a;--ok:#2dff7a;--warn:#ffd23f;--bad:#ff4d4d;color-scheme:dark}
:root[data-theme="sand"]{--bg:#f6efe3;--card:#fffaf0;--text:#3a2e1f;--muted:#8c7b63;--line:#e4d6bd;--accent:#c2571a;--ok:#2f8f4e;--warn:#b7791f;--bad:#c93a2f;color-scheme:light}
.sw{display:inline-flex;gap:6px;align-items:center}
.sw b{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);cursor:pointer;display:block}
.sw b.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
#bgc{width:34px;height:30px;padding:0;border:1px solid var(--line);border-radius:8px;background:none;cursor:pointer}
</style>
</head>
<body>
<main>
<div class="top"><div><h1>Центр управления сетью</h1>
<p class="sub">Ядро, агрегация и сеть доступа. Нажми на узел, чтобы управлять им, или имитируй аварию.</p></div><div class="pill"><span class="dot"></span><span id="clock"></span></div></div>
<div class="kpi">
<div><small>Доступность абонентов</small><strong id="k1"></strong></div>
<div><small>Без связи, абонентов</small><strong id="k2"></strong></div>
<div><small>Активные аварии</small><strong id="k3"></strong></div>
</div>
<div class="grid">
<section class="card">
<svg id="map" viewBox="0 0 600 330" role="img" aria-label="Топология сети"></svg>
<div class="legend"><span><i style="background:var(--ok)"></i>норма</span><span><i style="background:var(--warn)"></i>деградация</span><span><i style="background:var(--bad)"></i>авария</span><span><i style="background:var(--muted)"></i>нет связи с центром</span></div>
<div class="btns"><button id="rnd">Имитировать аварию</button><button id="all">Восстановить всё</button><span class="sw" id="sw"></span><input type="color" id="bgc" title="Свой цвет фона" aria-label="Свой цвет фона"></div>
</section>
<section>
<div class="card" id="panel" style="margin-bottom:14px"></div>
<div class="card"><h3>Журнал событий</h3><div class="log" id="log"></div></div>
</section>
</div>
</main>
<script>
var nodes=[{id:"c",n:"Ядро сети",t:"core",x:300,y:45,p:null}];
var i,j,subsSeed=[1800,2400,950,3100,1500,2200,2800,1200,1900];
for(i=0;i<3;i++){nodes.push({id:"a"+i,n:"Агрегация A"+(i+1),t:"agg",x:100+200*i,y:150,p:"c"});
for(j=0;j<3;j++)nodes.push({id:"b"+i+j,n:"БС-"+(i+1)+"0"+(j+1),t:"bs",x:100+200*i+(j-1)*65,y:265,p:"a"+i,subs:subsSeed[i*3+j]})}
var st={};nodes.forEach(function(n){st[n.id]="ok"});
var byId={};nodes.forEach(function(n){byId[n.id]=n});
var sel=null,logs=[];
function eff(n){if(st[n.id]==="down")return"down";if(n.p){var e=eff(byId[n.p]);if(e==="down"||e==="lost")return"lost"}return st[n.id]}
function kids(n){return nodes.filter(function(x){return x.p===n.id})}
function bsUnder(n){if(n.t==="bs")return[n];var r=[];kids(n).forEach(function(k){r=r.concat(bsUnder(k))});return r}
function log(sev,t){logs.unshift({sev:sev,t:t,time:new Date().toLocaleTimeString("ru-RU")});if(logs.length>12)logs.pop();render()}
var names={ok:"В норме",warn:"Деградация",down:"Авария",lost:"Нет связи с центром"};
var col={ok:"var(--ok)",warn:"var(--warn)",down:"var(--bad)",lost:"var(--muted)"};
function setSt(n,s){if(st[n.id]===s)return;st[n.id]=s;
if(s==="down"){var lost=bsUnder(n).filter(function(b){return b!==n}).length;log("down","Авария: "+n.n+(lost?". Потеряна связь с "+lost+" БС":""))}
else if(s==="warn")log("warn","Деградация: "+n.n+", рост потерь пакетов");
else log("ok","Восстановлено: "+n.n);}
function render(){
var g="";
nodes.forEach(function(n){if(n.p){var p=byId[n.p];g+='<line x1="'+p.x+'" y1="'+p.y+'" x2="'+n.x+'" y2="'+n.y+'" stroke="'+col[eff(n)==="lost"?"lost":eff(n)==="down"?"down":"ok"]+'" stroke-width="2" '+(eff(n)==="lost"||eff(n)==="down"?'stroke-dasharray="4 4"':'class="flow"')+'/>'}});
nodes.forEach(function(n){var e=eff(n),c=col[e],s=sel===n.id?' stroke="var(--accent)" stroke-width="3"':' stroke="var(--card)" stroke-width="2"';
g+='<g class="n'+(e==="down"?' pulse':'')+'" data-id="'+n.id+'" style="filter:drop-shadow(0 0 '+(e==="ok"?4:e==="lost"?0:9)+'px '+c+')">';
if(n.t==="bs")g+='<rect x="'+(n.x-22)+'" y="'+(n.y-16)+'" width="44" height="32" rx="7" fill="'+c+'"'+s+'/>';
else g+='<circle cx="'+n.x+'" cy="'+n.y+'" r="'+(n.t==="core"?26:21)+'" fill="'+c+'"'+s+'/>';
g+='<text x="'+n.x+'" y="'+(n.y+(n.t==="bs"?34:n.t==="core"?44:38))+'" text-anchor="middle" font-size="11" fill="var(--text)">'+n.n+'</text></g>'});
document.getElementById("map").innerHTML=g;
var tot=0,ok=0,al=0;
nodes.forEach(function(n){var e=eff(n);if(n.t==="bs"){tot+=n.subs;if(e==="ok"||e==="warn")ok+=n.subs}if(st[n.id]!=="ok")al++});
document.getElementById("k1").textContent=(100*ok/tot).toFixed(1)+"%";
document.getElementById("k2").textContent=(tot-ok).toLocaleString("ru-RU");
document.getElementById("k3").textContent=al;
var p=document.getElementById("panel");
if(!sel)p.innerHTML="<h3>Узел не выбран</h3><span style='color:var(--muted)'>Нажми на узел на схеме.</span>";
else{var n=byId[sel],e=eff(n),k=n.t==="bs"?"Базовая станция · "+n.subs.toLocaleString("ru-RU")+" абонентов":n.t==="agg"?"Узел агрегации · БС: "+kids(n).length:"Ядро · узлов агрегации: 3";
var load=e==="ok"?30+(n.n.length*7)%50:e==="warn"?92:0;
p.innerHTML="<h3>"+n.n+"</h3><div style='color:var(--muted)'>"+k+"</div><p style='margin:8px 0'>Статус: <b style='color:"+col[e]+"'>"+names[e]+"</b><br>Загрузка: <b>"+(e==="down"||e==="lost"?"—":load+"%")+"</b></p><div class='btns' style='margin:0'><button data-a='down'>Авария</button><button data-a='warn'>Деградация</button><button data-a='ok'>Восстановить</button></div>"}
document.getElementById("log").innerHTML=logs.length?logs.map(function(l){return"<p style='border-color:"+col[l.sev]+"'><span style='color:var(--muted)'>"+l.time+"</span> "+l.t+"</p>"}).join(""):"<span style='color:var(--muted)'>Событий пока нет.</span>";
}
document.getElementById("map").addEventListener("click",function(e){var g=e.target.closest(".n");if(g){sel=g.getAttribute("data-id");render()}});
document.getElementById("panel").addEventListener("click",function(e){var a=e.target.getAttribute("data-a");if(a&&sel){setSt(byId[sel],a);render()}});
document.getElementById("rnd").onclick=function(){var pool=nodes.filter(function(n){return n.t!=="core"&&st[n.id]!=="down"});if(pool.length){var n=pool[Math.floor(Math.random()*pool.length)];sel=n.id;setSt(n,"down");render()}};
document.getElementById("all").onclick=function(){nodes.forEach(function(n){st[n.id]="ok"});log("ok","Все узлы восстановлены")};
var themes=[["light","#f4f6f8","Светлая"],["dark","#12161b","Тёмная"],["navy","#0a1628","Диспетчерская"],["neon","#0d0221","Неон"],["green","#04110a","Терминал"],["sand","#f6efe3","Песок"]];
var swb=document.getElementById("sw"),bgc=document.getElementById("bgc");
function applyTheme(t,custom){var r=document.documentElement;r.setAttribute("data-theme",t);r.style.removeProperty("--bg");
if(custom){r.style.setProperty("--bg",custom);bgc.value=custom}else{var f=themes.filter(function(x){return x[0]===t})[0];if(f)bgc.value=f[1]}
[].forEach.call(swb.children,function(b){b.className=(b.getAttribute("data-t")===t&&!custom)?"on":""});
try{localStorage.setItem("noc-theme",JSON.stringify([t,custom||""]))}catch(e){}}
themes.forEach(function(t){var b=document.createElement("b");b.setAttribute("data-t",t[0]);b.title=t[2];b.style.background=t[1];b.onclick=function(){applyTheme(t[0])};swb.appendChild(b)});
bgc.oninput=function(){applyTheme(document.documentElement.getAttribute("data-theme")||"light",bgc.value)};
var sv=null;try{sv=JSON.parse(localStorage.getItem("noc-theme"))}catch(e){}
applyTheme(sv&&sv[0]?sv[0]:(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light"),sv&&sv[1]?sv[1]:"");
function tick(){document.getElementById("clock").textContent="NOC · онлайн · "+new Date().toLocaleTimeString("ru-RU")}
tick();setInterval(tick,1000);
render();
</script>
</body>
</html>
